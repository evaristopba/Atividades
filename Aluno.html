<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogo STOP - Aluno</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f1f5f9; margin: 0; padding: 15px; }
        #game-container { background: white; padding: 25px 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); text-align: center; width: 100%; max-width: 820px; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
        .btn-nav { background-color: #475569; color: white; padding: 6px 12px; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 0.85em; transition: background 0.2s; }
        .btn-nav:hover { background-color: #334155; }
        #status-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(220, 38, 38, 0.9); color: white; font-size: 5em; font-weight: 900; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #status-overlay span.subtext { font-size: 0.25em; font-weight: 500; margin-top: 10px; opacity: 0.9; }
        #room-id-display { font-size: 1.2em; font-weight: 700; color: #64748b; margin-bottom: 5px; }
        #player-badge { font-size: 0.95em; color: #16a34a; font-weight: 700; margin-bottom: 10px; }
        #letter-display { font-size: 6.5em; font-weight: 900; color: #2563eb; margin: 0; line-height: 1; text-shadow: 0 2px 10px rgba(37,99,235,0.15); }
        input { font-size: 1.05em; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; width: 100%; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        input:disabled { background-color: #f8fafc; color: #94a3b8; cursor: not-allowed; border-color: #e2e8f0; }
        #categories-container.modo-avancado { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px 20px; text-align: left; margin-top: 15px; }
        #categories-container.modo-simples { display: grid; grid-template-columns: 1fr; gap: 12px; max-width: 420px; margin: 15px auto 0 auto; text-align: left; }
        .category-item label { display: block; font-size: 0.95em; font-weight: 700; color: #334155; margin-bottom: 5px; }
        #nickname-gate-wrapper { max-width: 360px; margin: 20px auto; text-align: left; }
        #nickname-gate-wrapper label { font-size: 0.95em; font-weight: 700; color: #475569; display: block; margin-bottom: 8px; }
        #submit-button, #nickname-gate-button { width: 100%; padding: 14px; margin-top: 25px; font-size: 1.15em; font-weight: 700; color: white; background-color: #16a34a; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        #submit-button:hover:not(:disabled), #nickname-gate-button:hover { background-color: #15803d; }
        #submit-button:disabled { background-color: #cbd5e1; cursor: not-allowed; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: white; padding: 25px; border-radius: 12px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .modal-footer { margin-top: 20px; display: flex; justify-content: center; gap: 10px; }
        #modal-ok { background: #16a34a; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        #modal-cancel { background: #64748b; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-title" style="margin-top: 0; color: #1e293b;">Aviso</h3>
            <p id="modal-text" style="color: #64748b; font-size: 0.95em;"></p>
            <div class="modal-footer">
                <button id="modal-cancel" style="display: none;">Revisar</button>
                <button id="modal-ok">OK</button>
            </div>
        </div>
    </div>
    <div id="game-container">
        <h1>Carregando sala...</h1>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9eapu_h3mbN35TOVc2kbv86J7OFLRk4k",
            authDomain: "meu-super-jogo-stop.firebaseapp.com",
            databaseURL: "https://meu-super-jogo-stop-default-rtdb.firebaseio.com",
            projectId: "meu-super-jogo-stop",
            storageBucket: "meu-super-jogo-stop.firebasestorage.app",
            messagingSenderId: "958593186721",
            appId: "1:958593186721:web:29fd0897255ccb8e44a9e0"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const gameContainer = document.getElementById('game-container');
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('sala');
        const gameMode = urlParams.get('modo') || 'avancado';
        const friendlyNameFromUrl = urlParams.get('nome');

        // O apelido NUNCA é pré-preenchido nem lembrado entre sessões (mesmo
        // computador pode passar por vários alunos diferentes no mesmo dia).
        // É pedido do zero toda vez que a página carrega, e é obrigatório.
        let studentNickname = '';
        // Chave da resposta no Firebase: derivada do próprio apelido (não mais
        // um ID aleatório). Assim, se o aluno reconectar na mesma sala com o
        // MESMO apelido, ele sobrescreve a própria resposta em vez de virar
        // um registro fantasma duplicado.
        let studentKey = '';

        function slugify(nickname) {
            return (nickname || '')
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .trim()
                .replace(/[.#$\[\]\/]/g, '_')
                .replace(/\s+/g, '_')
                .substring(0, 60);
        }

        const CATEGORIAS_PADRAO = gameMode === 'simples' 
            ? ["Nome", "Cor", "Animal", "Brinquedo", "Comida"]
            : ["Nome", "Cor", "Animal", "Fruta", "Objeto", "Profissão", "País ou Cidade", "Comida", "Marca Famosa", "Filme ou Série"];

        function showCustomModal(title, text, type = 'alert', onConfirm = null) {
            const overlay = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-text').textContent = text;
            const btnCancel = document.getElementById('modal-cancel');
            const btnOk = document.getElementById('modal-ok');
            btnCancel.style.display = (type === 'confirm') ? 'inline-block' : 'none';
            btnOk.textContent = (type === 'confirm') ? 'Sim, Enviar!' : 'OK';
            overlay.style.display = 'flex';
            btnOk.onclick = () => { overlay.style.display = 'none'; if(onConfirm) onConfirm(); };
            btnCancel.onclick = () => { overlay.style.display = 'none'; };
        }

        if (!roomId) {
            gameContainer.innerHTML = '<div class="top-nav"><a href="HUBStop-GM.html" class="btn-nav">⬅ Voltar ao Hub</a></div><h2 style="color: #dc2626;">Link inválido. Peça o link da sala ao professor.</h2>';
        } else {
            renderNicknameGate();
        }

        // ============================================
        // TELA OBRIGATÓRIA DE APELIDO (sempre em branco, sempre exigida)
        // ============================================
        function renderNicknameGate() {
            gameContainer.innerHTML = '<div class="top-nav"><a href="HUBStop-GM.html" class="btn-nav">⬅ Voltar ao Hub</a></div>' +
                '<h2 style="color: #475569;">Antes de continuar...</h2>' +
                '<div id="nickname-gate-wrapper">' +
                '<label for="nickname-gate-input">Digite seu nome ou apelido pra entrar na sala:</label>' +
                '<input type="text" id="nickname-gate-input" placeholder="Seu nome completo ou apelido" autocomplete="off">' +
                '</div>' +
                '<button id="nickname-gate-button">CONTINUAR</button>';

            const input = document.getElementById('nickname-gate-input');
            const button = document.getElementById('nickname-gate-button');
            input.focus();

            function tryConfirm() {
                const typed = input.value.trim();
                if (!typed) {
                    showCustomModal('Atenção', 'Digite seu nome ou apelido pra continuar — é obrigatório!');
                    input.focus();
                    return;
                }
                confirmNicknameAndEnter(typed);
            }

            button.addEventListener('click', tryConfirm);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); tryConfirm(); }
            });
        }

        function confirmNicknameAndEnter(typedNickname) {
            const baseSlug = slugify(typedNickname) || ('aluno_' + Math.random().toString(36).substring(2, 7));
            // Checa colisão (dois alunos com o mesmo apelido na mesma sala) uma
            // única vez, no momento da confirmação, e desambigua se precisar.
            database.ref('salas/' + roomId + '/respostas/' + baseSlug).once('value').then((snap) => {
                let finalSlug = baseSlug;
                if (snap.exists()) {
                    let n = 2;
                    finalSlug = baseSlug + '-' + n;
                    // não precisamos checar em loop contra o banco de novo: colisão
                    // tripla no mesmo instante é extremamente improvável em sala de aula.
                }
                studentNickname = typedNickname;
                studentKey = finalSlug;
                enterWaitingRoom();
            }).catch(() => {
                // Se a checagem falhar por algum motivo, segue mesmo assim com o slug base.
                studentNickname = typedNickname;
                studentKey = baseSlug;
                enterWaitingRoom();
            });
        }

        function enterWaitingRoom() {
            const initialDisplayName = friendlyNameFromUrl ? decodeURIComponent(friendlyNameFromUrl) : 'Sala: ' + roomId;
            gameContainer.innerHTML = '<div class="top-nav"><a href="HUBStop-GM.html" class="btn-nav">⬅ Voltar ao Hub</a></div><h2 style="color: #475569;">Aguardando o professor iniciar na sala:<br><span style="color: #2563eb;">' + initialDisplayName + '</span></h2>';
            const gameStateRef = database.ref('salas/' + roomId);
            let previousStatus = 'AGUARDANDO';

            gameStateRef.on('value', (snapshot) => {
                const state = snapshot.val();
                if (!state || state.status === 'ENCERRADA') {
                    gameContainer.innerHTML = '<div class="top-nav"><a href="HUBStop-GM.html" class="btn-nav">⬅ Voltar ao Hub</a></div><h2 style="color: #dc2626;">Sessão Encerrada</h2><p style="color: #64748b;">Esta sala foi encerrada pelo professor.</p>';
                    return;
                }
                const currentCategories = state.categorias || CATEGORIAS_PADRAO;
                if (!document.getElementById('letter-display')) {
                    renderGameStructure(state.displayName || initialDisplayName, currentCategories);
                    setupSubmitListener();
                }
                if (previousStatus === 'JOGANDO' && state.status !== 'JOGANDO') {
                    autoSaveAnswers();
                }
                previousStatus = state.status;
                updateGameState(state);
            });
        }

        function renderGameStructure(displayName, categorias) {
            let categoriesHTML = '';
            categorias.forEach((cat, index) => {
                const idCat = 'cat_' + index;
                categoriesHTML += '<div class="category-item"><label for="' + idCat + '">' + cat + ':</label><input type="text" id="' + idCat + '" class="game-input" data-category="' + cat + '" autocomplete="off"></div>';
            });
            gameContainer.innerHTML = '<div class="top-nav"><a href="HUBStop-GM.html" class="btn-nav">⬅ Voltar ao Hub</a></div>' +
                '<div id="room-id-display">' + displayName + '</div>' +
                '<div id="player-badge">Jogando como: ' + studentNickname + '</div>' +
                '<div id="letter-display">?</div>' +
                '<div id="categories-container" class="' + (gameMode === 'simples' ? 'modo-simples' : 'modo-avancado') + '">' + categoriesHTML + '</div>' +
                '<button id="submit-button">ENVIAR RESPOSTAS</button>' +
                '<div id="status-overlay" style="display: none;">STOP!<span class="subtext">Respostas travadas e enviadas ao professor</span></div>';

            const inputs = document.querySelectorAll('.game-input');
            inputs.forEach((input, idx) => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (idx + 1 < inputs.length) inputs[idx + 1].focus();
                        else document.getElementById('submit-button').click();
                    }
                });
            });
        }

        function updateGameState(state) {
            document.getElementById('letter-display').textContent = state.letter || '?';
            const overlay = document.querySelector('#status-overlay');
            const elementsToToggle = document.querySelectorAll('.game-input, #submit-button');
            const isPlaying = state.status === 'JOGANDO';
            overlay.style.display = isPlaying ? 'none' : 'flex';
            elementsToToggle.forEach(el => el.disabled = !isPlaying);
            if (state.status === 'AGUARDANDO') {
                document.querySelectorAll('.game-input').forEach(input => input.value = '');
            }
        }

        function getAnswersPayload() {
            const answers = {};
            document.querySelectorAll('.game-input').forEach(input => {
                answers[input.dataset.category] = input.value.trim();
            });
            return { nickname: studentNickname, respostas: answers, timestamp: Date.now() };
        }

        function autoSaveAnswers() {
            database.ref('salas/' + roomId + '/respostas/' + studentKey).set(getAnswersPayload());
        }

        function setupSubmitListener() {
            document.getElementById('submit-button')?.addEventListener('click', () => {
                showCustomModal("Confirmar Envio", "Deseja enviar suas respostas agora?", "confirm", () => {
                    database.ref('salas/' + roomId + '/respostas/' + studentKey).set(getAnswersPayload())
                        .then(() => showCustomModal("Sucesso!", "Respostas registradas com sucesso!"))
                        .catch(err => showCustomModal("Erro", "Falha ao enviar: " + err.message));
                });
            });
        }
    </script>
</body>
</html>
