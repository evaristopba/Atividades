<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogo STOP - Aluno</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f0f2f5; margin: 0; padding: 15px; box-sizing: border-box; }
        #game-container { background: white; padding: 25px 40px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 800px; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #dee2e6; padding-bottom: 10px; }
        .btn-nav { background-color: #6c757d; color: white; padding: 6px 12px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 0.85em; transition: background 0.2s; }
        .btn-nav:hover { background-color: #5a6268; }
        #status-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(220, 53, 69, 0.85); color: white; font-size: 6em; font-weight: bold; display: flex; justify-content: center; align-items: center; z-index: 10; text-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
        #room-id-display { font-size: 1.5em; font-weight: bold; color: #6c757d; margin-bottom: 10px; }
        #letter-display { font-size: 8em; font-weight: bold; color: #007BFF; margin: 10px 0 20px 0; }
        input { font-size: 1.1em; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }
        input:disabled { background-color: #e9ecef; cursor: not-allowed; }
        #categories-container.modo-avancado { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 30px; text-align: left; }
        #categories-container.modo-simples { display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 400px; margin: 0 auto; text-align: left; }
        .category-item label { display: block; font-size: 1.2em; font-weight: bold; color: #343a40; margin-bottom: 5px; }
        .category-item input { width: 100%; }
        #nickname-input { width: 50%; margin-bottom: 20px; }
        #submit-button { width: 100%; padding: 15px; margin-top: 30px; font-size: 1.3em; font-weight: bold; color: white; background-color: #28a745; border: none; border-radius: 6px; cursor: pointer; transition: opacity 0.2s; }
        #submit-button:hover:not(:disabled) { opacity: 0.85; }
        #submit-button:disabled { background-color: #ced4da; }

        /* ESTILOS DO MODAL CUSTOMIZADO (DEMANDA VISUAL) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: white; padding: 25px; border-radius: 12px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal-box h3 { margin-top: 0; color: #343a40; }
        .modal-box p { color: #666; font-size: 1.1em; line-height: 1.4; }
        .modal-footer { margin-top: 20px; display: flex; justify-content: center; gap: 10px; }
        #modal-ok { background: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #modal-cancel { background: #dc3545; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <!-- Estrutura do Modal Customizado -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-title">Aviso</h3>
            <p id="modal-text"></p>
            <div class="modal-footer">
                <button id="modal-cancel" style="display: none;">Revisar</button>
                <button id="modal-ok">OK</button>
            </div>
        </div>
    </div>

    <div id="game-container">
        <h1>Carregando sala...</h1>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9eapu_h3mbN35TOVc2kbv86J7OFLRk4k",
            authDomain: "meu-super-jogo-stop.firebaseapp.com",
            databaseURL: "https://meu-super-jogo-stop-default-rtdb.firebaseio.com",
            projectId: "meu-super-jogo-stop",
            storageBucket: "meu-super-jogo-stop.firebasestorage.app",
            messagingSenderId: "958593186721",
            appId: "1:958593186721:web:29fd0897255ccb8e44a9e0",
            measurementId: "G-WGRJWRVBEN"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const gameContainer = document.getElementById('game-container');
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('sala');
        const gameMode = urlParams.get('modo') || 'avancado';
        const friendlyNameFromUrl = urlParams.get('nome');
        let answersRef;

        const CATEGORIAS_AVANCADO = ["Nome", "Cor", "Animal", "Fruta", "Objeto", "Profissão", "País ou Cidade", "Comida", "Marca Famosa", "Filme ou Série"];
        const CATEGORIAS_SIMPLES = ["Nome", "Cor", "Animal", "Brinquedo", "Comida"];

        // FUNÇÃO APOIO AO MODAL CUSTOMIZADO
        function showCustomModal(title, text, type = 'alert', onConfirm = null) {
            const overlay = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-text').textContent = text;
            const btnCancel = document.getElementById('modal-cancel');
            const btnOk = document.getElementById('modal-ok');
            
            btnCancel.style.display = (type === 'confirm') ? 'inline-block' : 'none';
            btnOk.textContent = (type === 'confirm') ? 'Sim, Enviar!' : 'OK';
            overlay.style.display = 'flex';

            btnOk.onclick = () => { overlay.style.display = 'none'; if(onConfirm) onConfirm(); };
            btnCancel.onclick = () => { overlay.style.display = 'none'; };
        }

        if (!roomId) {
            gameContainer.innerHTML = `
                <div class="top-nav">
                    <a href="HUBStop-GM.html" class="btn-nav">⬅ Voltar ao Hub STOP</a>
                </div>
                <h1>ERRO: Link inválido. Peça o link correto ao seu professor.</h1>
            `;
        } else {
            const initialDisplayName = friendlyNameFromUrl ? decodeURIComponent(friendlyNameFromUrl) : `sala "${roomId}"`;
            gameContainer.innerHTML = `
                <div class="top-nav">
                    <a href="HUBStop-GM.html" class="btn-nav">⬅ Voltar ao Hub STOP</a>
                </div>
                <h1>Aguardando o professor iniciar o jogo na sala:<br><span style="color: #007bff;">${initialDisplayName}</span></h1>
            `;

            const gameStateRef = database.ref('salas/' + roomId);
            answersRef = database.ref('salas/' + roomId + '/respostas');
            
            let isStudentActiveInRoom = false;
            let hasShownClosedNotice = false;

            function handleRoomClosed() {
                if (hasShownClosedNotice) return;
                hasShownClosedNotice = true;
                const initialDisplayName = friendlyNameFromUrl ? decodeURIComponent(friendlyNameFromUrl) : `sala "${roomId}"`;
                
                gameContainer.innerHTML = `
                    <div class="top-nav">
                        <a href="HUBStop-GM.html" class="btn-nav">⬅ Voltar ao Hub STOP</a>
                    </div>
                    <div style="padding: 30px 10px; text-align: center;">
                        <h1 style="color: #dc3545; margin-bottom: 15px;">🚫 Sessão Encerrada</h1>
                        <p style="font-size: 1.2em; color: #495057; line-height: 1.5; margin-bottom: 25px;">
                            A sessão para a <strong>${initialDisplayName}</strong> foi encerrada pelo Administrador ou Professor.
                        </p>
                        <a href="HUBStop-GM.html" class="btn-nav" style="background-color: #007bff; font-size: 1.1em; padding: 12px 24px; display: inline-block;">
                            ⬅ Voltar ao Hub STOP
                        </a>
                    </div>
                `;
                showCustomModal("Sessão Encerrada", "A sala foi encerrada pelo Administrador ou Professor.", "alert");
            }

            gameStateRef.on('value', (snapshot) => {
                const state = snapshot.val();
                if (!state || !state.status || state.status === 'ENCERRADA') {
                    if (isStudentActiveInRoom || document.getElementById('letter-display')) {
                        handleRoomClosed();
                    }
                    return;
                }
                
                isStudentActiveInRoom = true;
                hasShownClosedNotice = false;
                const currentDisplayName = state.displayName || initialDisplayName;
                
                if (!document.getElementById('letter-display')) {
                    renderGameStructure(currentDisplayName, gameMode);
                    setupSubmitListener();
                    setupNicknamePersistence();
                }
                updateGameState(state);
            });
        }

        function updateGameState(state) {
            const displayName = state.displayName || friendlyNameFromUrl || `Sala: ${roomId}`;
            document.getElementById('room-id-display').textContent = displayName;
            document.getElementById('letter-display').textContent = state.letter;
            const overlay = document.querySelector('#status-overlay');
            const elementsToToggle = document.querySelectorAll('input, #submit-button');
            const isPlaying = state.status === 'JOGANDO';

            overlay.style.display = isPlaying ? 'none' : 'flex';
            elementsToToggle.forEach(el => el.disabled = !isPlaying);

            // REGRA EXTRA DE SEGURANÇA PARA O APELIDO:
            const nicknameInput = document.getElementById('nickname-input');
            if (nicknameInput && state.status !== 'AGUARDANDO') {
                // Se o jogo já começou ou parou, e tem texto no apelido, ele fica travado.
                if (nicknameInput.value.trim() !== "") {
                    nicknameInput.disabled = true;
                }
            }

            if (state.status === 'AGUARDANDO') {
                const categoryInputs = document.querySelectorAll('.game-input');
                categoryInputs.forEach(input => {
                    input.value = '';
                });
                // No modo aguardando, garante que o apelido possa ser editado
                if (nicknameInput) nicknameInput.disabled = false;
            }
        }

        function renderGameStructure(displayName, mode) {
            const categorias = mode === 'simples' ? CATEGORIAS_SIMPLES : CATEGORIAS_AVANCADO;
            let categoriesHTML = '';
            categorias.forEach(categoria => {
                const idCategoria = categoria.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
                categoriesHTML += `<div class="category-item"><label for="${idCategoria}">${categoria}:</label><input type="text" id="${idCategoria}" class="game-input" data-category="${categoria}"></div>`;
            });
            const roomNameForDisplay = displayName;
            const containerClass = mode === 'simples' ? 'modo-simples' : 'modo-avancado';
            gameContainer.innerHTML = `
                <div class="top-nav">
                    <a href="HUBStop-GM.html" class="btn-nav">⬅ Voltar ao Hub STOP</a>
                </div>
                <div id="room-id-display">${roomNameForDisplay}</div>
                <div id="letter-display">?</div>
                <hr>
                <label for="nickname-input" style="font-weight: bold; font-size: 1.2em;">Seu Apelido:</label><br>
                <input type="text" id="nickname-input" placeholder="Apelido único">
                <div id="categories-container" class="${containerClass}">${categoriesHTML}</div>
                <button id="submit-button">ENVIAR RESPOSTAS</button>
                <div id="status-overlay" style="display: none;">STOP!</div>
            `;
        }

        function setupNicknamePersistence() {
            const nicknameInput = document.getElementById('nickname-input');
            const storageKey = `stopGameNickname_${roomId}`;
            const savedNickname = sessionStorage.getItem(storageKey);
            if (savedNickname) {
                nicknameInput.value = savedNickname;
            }
            nicknameInput.addEventListener('input', () => {
                sessionStorage.setItem(storageKey, nicknameInput.value);
            });
        }

        function setupSubmitListener() {
            const submitButton = document.getElementById('submit-button');
            submitButton.addEventListener('click', () => {
                const nickname = document.getElementById('nickname-input').value.trim();
                
                if (!nickname) { 
                    showCustomModal("Atenção", "Por favor, preencha seu apelido antes de enviar!"); 
                    return; 
                }

                // USO DO MODAL PARA CONFIRMAÇÃO (DEMANDA ATUAL)
                showCustomModal("Confirmar Envio", "Você deseja enviar suas respostas agora?", "confirm", () => {
                    const answers = {};
                    const categoryInputs = document.querySelectorAll('.game-input');
                    categoryInputs.forEach(input => {
                        const categoryName = input.dataset.category;
                        answers[categoryName] = input.value.trim();
                    });

                    // Engine original de envio preservada
                    answersRef.child(nickname).set(answers)
                        .then(() => { 
                            showCustomModal("Sucesso!", "Suas respostas foram enviadas/atualizadas com sucesso!"); 
                        })
                        .catch((error) => { 
                            console.error('Erro ao enviar respostas:', error); 
                            showCustomModal("Erro", "Ocorreu um erro ao enviar suas respostas."); 
                        });
                });
            });
        }
    </script>
</body>
</html>
